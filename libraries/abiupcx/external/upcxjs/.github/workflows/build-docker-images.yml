name: Build Docker Images
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  check-tokens:
    name: "Check Docker Hub Token"
    runs-on: ubuntu-18.04
    steps:
      - name: Check for DOCKERHUB_TOKEN
        id: check_token
        run: echo ::set-output name=token_exists::${HAS_SECRET}
        env:
          HAS_SECRET: ${{ secrets.DOCKERHUB_TOKEN != null }}
      - name: Succeed job on existing DOCKERHUB_TOKEN
        if: ${{ steps.check_token.outputs.token_exists == 'true' }}
        uses: actions/github-script@v3
        with:
          script: |
            core.setOutput('Success. DOCKERHUB_TOKEN is present in repository secrets.');
      - name: Fail on missing DOCKERHUB_TOKEN
        if: ${{ steps.check_token.outputs.token_exists == 'false' }}
        uses: actions/github-script@v3
        with:
          script: |
            core.setFailed('Failure: No DOCKERHUB_TOKEN present in repository secrets.');

  build-docker-2_0_x:
    name: Build Docker - nodupcx release/2.0.x
    runs-on: ubuntu-18.04
    needs: check-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f
        with:
          token: ${{ github.token }}
      - name: Get nodupcx sha
        id: nodupcx
        uses: actions/github-script@v3
        with:
          script: |
            const nodupcxVersion = 'v2.0.';
            const releaseList = await github.paginate('GET /repos/upcx/upcx/releases');
            const releases = releaseList.map(release => {
              return {
                tag: release.tag_name,
                published_at: new Date(release.published_at),
              };
            })
            .filter(release => release.tag.startsWith(nodupcxVersion))
            .sort((a, b) => b.published_at - a.published_at);
            const tagList = await github.paginate('GET /repos/upcx/upcx/tags');
            const tag = tagList.filter(tag => tag.name === releases[0].tag);
            return tag[0].commit.sha;
      - name: Nodupcx sha
        id: nodupcx-sha
        run: |
          SHA=$(echo "${NODUPCX_SHA_FROM_JS}" | tr -d '"')
          echo ::set-output name=NODUPCX_SHA::${SHA}
        env:
          NODUPCX_SHA_FROM_JS: ${{ steps.nodupcx.outputs.result }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@0d135e0c2fc0dba0729c1a47ecfcf5a3c7f8579e
      - name: Login to DockerHub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: ./.github/upcxjs-ci
          file: ./.github/upcxjs-ci/Dockerfile
          pull: true
          push: true
          no-cache: true
          build-args: |
            UPCXBRANCH=release_2.0.x
            CDTBRANCH=release_1.7.x
          tags: |
            upcx/upcxjs-ci:release_2.0.x
            upcx/upcxjs-ci:${{ steps.nodupcx-sha.outputs.NODUPCX_SHA }}

  build-docker-2_1_x:
    name: Build Docker - nodupcx release/2.1.x
    runs-on: ubuntu-18.04
    needs: check-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f
        with:
          token: ${{ github.token }}
      - name: Get nodupcx sha
        id: nodupcx
        uses: actions/github-script@v3
        with:
          script: |
            const nodupcxVersion = 'v2.1.';
            const releaseList = await github.paginate('GET /repos/upcx/upcx/releases');
            const releases = releaseList.map(release => {
              return {
                tag: release.tag_name,
                published_at: new Date(release.published_at),
              };
            })
            .filter(release => release.tag.startsWith(nodupcxVersion))
            .sort((a, b) => b.published_at - a.published_at);
            const tagList = await github.paginate('GET /repos/upcx/upcx/tags');
            const tag = tagList.filter(tag => tag.name === releases[0].tag);
            return tag[0].commit.sha;
      - name: Nodupcx sha
        id: nodupcx-sha
        run: |
          SHA=$(echo "${NODUPCX_SHA_FROM_JS}" | tr -d '"')
          echo ::set-output name=NODUPCX_SHA::${SHA}
        env:
          NODUPCX_SHA_FROM_JS: ${{ steps.nodupcx.outputs.result }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@0d135e0c2fc0dba0729c1a47ecfcf5a3c7f8579e
      - name: Login to DockerHub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: ./.github/upcxjs-ci
          file: ./.github/upcxjs-ci/Dockerfile
          pull: true
          push: true
          no-cache: true
          build-args: |
            UPCXBRANCH=release_2.1.x
            CDTBRANCH=release_1.8.x
          tags: |
            upcx/upcxjs-ci:release_2.1.x
            upcx/upcxjs-ci:${{ steps.nodupcx-sha.outputs.NODUPCX_SHA }}

  build-docker-2_2_x:
    name: Build Docker - nodupcx release/2.2.x
    runs-on: ubuntu-18.04
    needs: check-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f
        with:
          token: ${{ github.token }}
      - name: Get nodupcx sha
        id: nodupcx
        uses: actions/github-script@v3
        with:
          script: |
            const nodupcxVersion = 'v2.2.';
            const releaseList = await github.paginate('GET /repos/upcx/upcx/releases');
            const releases = releaseList.map(release => {
              return {
                tag: release.tag_name,
                published_at: new Date(release.published_at),
              };
            })
            .filter(release => release.tag.startsWith(nodupcxVersion))
            .sort((a, b) => b.published_at - a.published_at);
            const tagList = await github.paginate('GET /repos/upcx/upcx/tags');
            const tag = tagList.filter(tag => tag.name === releases[0].tag);
            return tag[0].commit.sha;
      - name: Nodupcx sha
        id: nodupcx-sha
        run: |
          SHA=$(echo "${NODUPCX_SHA_FROM_JS}" | tr -d '"')
          echo ::set-output name=NODUPCX_SHA::${SHA}
        env:
          NODUPCX_SHA_FROM_JS: ${{ steps.nodupcx.outputs.result }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c308fdd69d26ed66f4506ebd74b180abe5362145
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@0d135e0c2fc0dba0729c1a47ecfcf5a3c7f8579e
      - name: Login to DockerHub
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@e1b7f96249f2e4c8e4ac1519b9608c0d48944a1f
        with:
          context: ./.github/upcxjs-ci
          file: ./.github/upcxjs-ci/Dockerfile
          pull: true
          push: true
          no-cache: true
          build-args: |
            UPCXBRANCH=release_2.2.x
            CDTBRANCH=release_1.8.x
          tags: |
            upcx/upcxjs-ci:release_2.2.x
            upcx/upcxjs-ci:${{ steps.nodupcx-sha.outputs.NODUPCX_SHA }}

  build-docker-develop:
    name: Build Docker - nodupcx develop
    runs-on: ubuntu-18.04
    needs: check-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f
        with:
          token: ${{ github.token }}
      - name: Get nodupcx sha
        id: nodupcx
        uses: actions/github-script@v3
        with:
          script: |
            const developRef = await github.request('GET /repos/upcx/upcx/git/refs/heads/develop');
            return developRef.data.object.sha;
      - name: Nodupcx sha
        id: nodupcx-sha
        run: |
          SHA=$(echo "${NODUPCX_SHA_FROM_JS}" | tr -d '"')
          echo ::set-output name=NODUPCX_SHA::${SHA}
        env:
          NODUPCX_SHA_FROM_JS: ${{ steps.nodupcx.outputs.result }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c308fdd69d26ed66f4506ebd74b180abe5362145
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@0d135e0c2fc0dba0729c1a47ecfcf5a3c7f8579e
      - name: Login to DockerHub
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@e1b7f96249f2e4c8e4ac1519b9608c0d48944a1f
        with:
          context: ./.github/upcxjs-ci
          file: ./.github/upcxjs-ci/Dockerfile
          pull: true
          push: true
          no-cache: true
          build-args: |
            UPCXBRANCH=develop
            CDTBRANCH=develop
          tags: |
            upcx/upcxjs-ci:develop
            upcx/upcxjs-ci:${{ steps.nodupcx-sha.outputs.NODUPCX_SHA }}
